<!-- LMS REUSABLE NAVBAR WITH REAL-TIME AUTH & ROLE-BASED DASHBOARD LINK -->
<header class="navbar-header">
  <div class="navbar-container">

    <!-- BRAND LOGO BADGE -->
    <a class="brand-logo" routerLink="/home" (click)="setActiveTab('Home')">
      <div class="logo-badge">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="brand-text-group">
        <span class="brand-name">LearnSphere</span>
      </div>
    </a>

    <!-- DESKTOP NAV LINKS -->
    <nav class="desktop-nav-links">
      <a routerLink="/home" class="nav-item" [class.active]="activeTab === 'Home'" (click)="setActiveTab('Home')">
        Home
      </a>
      <a routerLink="/home" class="nav-item" [class.active]="activeTab === 'Courses'" (click)="setActiveTab('Courses')">
        Courses
      </a>
      <a routerLink="/home" class="nav-item" [class.active]="activeTab === 'Live Classes'" (click)="setActiveTab('Live Classes')">
        Live Classes
      </a>
      <a routerLink="/home" class="nav-item" [class.active]="activeTab === 'Practice Tests'" (click)="setActiveTab('Practice Tests')">
        Practice Tests
      </a>
      <a routerLink="/home" class="nav-item" [class.active]="activeTab === 'Pricing / Plans'" (click)="setActiveTab('Pricing / Plans')">
        Pricing / Plans
      </a>
      <a routerLink="/home" class="nav-item" [class.active]="activeTab === 'Contact Us'" (click)="setActiveTab('Contact Us')">
        Contact Us
      </a>
    </nav>

    <!-- RIGHT SIDE ACTIONS -->
    <div class="desktop-actions">

      <!-- 🔍 SEARCH COURSE TOGGLE -->
      <div class="search-wrapper">
        <button class="action-icon-btn" (click)="toggleSearch()" title="Search Course">
          🔍
        </button>

        <div class="search-dropdown" *ngIf="isSearchOpen">
          <span class="search-icon-inside">🔍</span>
          <input type="text" placeholder="Search Courses, Tutors..." class="search-input" autofocus />
          <button class="search-close-btn" (click)="toggleSearch()">✕</button>
        </div>
      </div>

      <!-- LOGGED OUT STATE: GET STARTED BUTTON ONLY -->
      <ng-container *ngIf="!isLoggedIn">
        <button class="register-btn" (click)="openAuthModal('signup')">
          Get Started
        </button>
      </ng-container>

      <!-- LOGGED IN STATE: USER BADGE & DASHBOARD BUTTON -->
      <ng-container *ngIf="isLoggedIn && currentUser">
        <button class="dashboard-btn" (click)="goToDashboard()">
          <span>📊 Dashboard</span>
        </button>

        <div class="user-profile-wrapper">
          <button class="user-avatar-btn" (click)="toggleUserDropdown()" title="User Profile">
            <div class="avatar-circle">
              {{ currentUser.name.charAt(0) | uppercase }}
            </div>
            <span class="user-name-text">{{ currentUser.name }}</span>
            <span class="role-pill" [ngClass]="userRole">{{ userRole | uppercase }}</span>
            <span class="dropdown-chevron">▼</span>
          </button>

          <div class="user-dropdown-menu" *ngIf="isUserDropdownOpen">
            <div class="dropdown-user-header">
              <div class="header-name">{{ currentUser.name }}</div>
              <div class="header-email">{{ currentUser.email }}</div>
              <span class="role-badge-small">{{ userRole | titlecase }} Account</span>
            </div>
            <hr class="dropdown-divider" />
            <button class="dropdown-item" (click)="goToDashboard()">
              <span>🚀 My Dashboard</span>
            </button>
            <button class="dropdown-item logout-item" (click)="logout()">
              <span>🚪 Sign Out</span>
            </button>
          </div>
        </div>
      </ng-container>

      <!-- ☰ HAMBURGER MENU BUTTON -->
      <button class="hamburger-btn" (click)="toggleMobileMenu()" aria-label="Toggle Navigation Menu">
        <span *ngIf="!isMobileMenuOpen">☰</span>
        <span *ngIf="isMobileMenuOpen">✕</span>
      </button>

    </div>

  </div>

  <!-- MOBILE & TABLET EXPANDABLE MENU -->
  <div class="mobile-menu-drawer" *ngIf="isMobileMenuOpen">
    <div class="mobile-menu-content">

      <!-- SEARCH BAR IN MOBILE MENU -->
      <div class="mobile-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search courses, mentors..." class="mobile-search-input" />
      </div>

      <!-- NAVIGATION LINKS LIST -->
      <div class="mobile-nav-links">
        <a routerLink="/home" class="mobile-nav-item" [class.active]="activeTab === 'Home'" (click)="setActiveTab('Home')">Home</a>
        <a routerLink="/home" class="mobile-nav-item" [class.active]="activeTab === 'Courses'" (click)="setActiveTab('Courses')">Courses</a>
        <a routerLink="/home" class="mobile-nav-item" [class.active]="activeTab === 'Live Classes'" (click)="setActiveTab('Live Classes')">Live Classes</a>
        <a routerLink="/home" class="mobile-nav-item" [class.active]="activeTab === 'Practice Tests'" (click)="setActiveTab('Practice Tests')">Practice Tests</a>
        <a routerLink="/home" class="mobile-nav-item" [class.active]="activeTab === 'Pricing / Plans'" (click)="setActiveTab('Pricing / Plans')">Pricing / Plans</a>
        <a routerLink="/home" class="mobile-nav-item" [class.active]="activeTab === 'Contact Us'" (click)="setActiveTab('Contact Us')">Contact Us</a>
      </div>

      <!-- CONTROL BUTTONS GRID -->
      <div class="mobile-controls-section">
        <ng-container *ngIf="!isLoggedIn">
          <button class="mobile-register-btn" (click)="openAuthModal('signup')">
            Get Started
          </button>
        </ng-container>

        <ng-container *ngIf="isLoggedIn && currentUser">
          <div class="mobile-user-card">
            <div class="mobile-user-name">👤 {{ currentUser.name }}</div>
            <div class="mobile-user-role">Role: {{ userRole | uppercase }}</div>
          </div>
          <button class="mobile-dashboard-btn" (click)="goToDashboard()">
            Go to My Dashboard
          </button>
          <button class="mobile-logout-btn" (click)="logout()">
            Sign Out
          </button>
        </ng-container>
      </div>

    </div>
  </div>

</header>

<!-- REUSABLE AUTH MODAL COMPONENT -->
<app-auth-modal [isOpen]="isAuthModalOpen" [authMode]="authMode" (closed)="closeAuthModal()"></app-auth-modal>
