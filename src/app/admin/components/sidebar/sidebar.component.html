<div class="admin-layout-wrapper">
  
  <!-- ULTIMA TOP HEADER BAR SPANNING 100% WIDTH ACROSS THE TOP -->
  <app-header></app-header>

  <!-- MAIN BODY: LEFT SIDEBAR & RIGHT CONTENT OUTLET -->
  <div class="admin-layout-body">
    <ion-split-pane contentId="main-admin-content" when="lg">
      
      <!-- ULTIMA LEFT SIDEBAR MENU -->
      <ion-menu [side]="menuSide" contentId="main-admin-content" type="overlay" menuId="admin-menu">
        
        <!-- SIDEBAR SCROLLABLE CONTENT -->
        <ion-content class="sidebar-content">
          
          <div class="menu-categories-wrapper">
            
            <ion-list class="sidebar-menu-list" lines="none">
              <ion-item routerLink="/admin/dashboard" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="speedometer-outline" slot="start"></ion-icon>
                <ion-label>DASHBOARD</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/add-student" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="people-outline" slot="start"></ion-icon>
                <ion-label>USERS</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/academic" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="book-outline" slot="start"></ion-icon>
                <ion-label>COURSES</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/batches" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="layers-outline" slot="start"></ion-icon>
                <ion-label>BATCHES</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/quizzes" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="help-circle-outline" slot="start"></ion-icon>
                <ion-label>QUIZZES</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/attendance" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="calendar-outline" slot="start"></ion-icon>
                <ion-label>ATTENDANCE</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/payments" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="wallet-outline" slot="start"></ion-icon>
                <ion-label>PAYMENTS</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/certificates" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="ribbon-outline" slot="start"></ion-icon>
                <ion-label>CERTIFICATES</ion-label>
              </ion-item>

              <ion-item routerLink="/admin/reports" [detail]="false" routerLinkActive="active-menu" (click)="closeSidebar()">
                <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
                <ion-label>REPORTS</ion-label>
              </ion-item>



              <ion-item (click)="logout()" lines="none" class="logout-item" [detail]="false" [button]="true">
                <ion-icon name="log-out-outline" slot="start"></ion-icon>
                <ion-label>LOGOUT</ion-label>
              </ion-item>
            </ion-list>

          </div>

        </ion-content>

        <!-- BOTTOM USER PROFILE FOOTER CARD (MATCHING ULTIMA SIDEBAR BOTTOM SCREENSHOT) -->
        <div class="sidebar-profile-footer" (click)="goToAccountSetting()">
          <div class="footer-avatar">
            {{ adminInitials }}
          </div>
          <div class="footer-user-details">
            <span class="user-name">{{ adminName }}</span>
            <span class="user-role">{{ adminRole }}</span>
          </div>
          <span class="footer-expand-arrow">^</span>
        </div>

      </ion-menu>

      <!-- ROUTER OUTLET FOR ADMIN PAGE CONTENT -->
      <div id="main-admin-content" class="main-page-container" (click)="onContentClick()">
        <ion-router-outlet></ion-router-outlet>
      </div>

    </ion-split-pane>
  </div>

</div>
