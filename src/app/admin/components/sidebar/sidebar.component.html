<ion-split-pane contentId="main-admin-content" when="md">
  <!-- ADMIN SIDEBAR MENU -->
  <ion-menu contentId="main-admin-content" type="overlay" menuId="admin-menu">
    
    <ion-header>
      <ion-toolbar color="primary">
        <ion-item lines="none" color="primary">
          <ion-icon name="shield-checkmark" slot="start" size="large"></ion-icon>
          <ion-label>
            <h2><b>LMS Admin</b></h2>
            <p>Control Center</p>
          </ion-label>
        </ion-item>
      </ion-toolbar>
    </ion-header>

    <ion-content class="sidebar-content">
      
      <!-- MENU GROUPS -->
      <ion-list-header>
        <ion-label>MAIN NAVIGATION</ion-label>
      </ion-list-header>

      <ion-list class="sidebar-menu" lines="none">
        
        <ion-item routerLink="/admin/dashboard" routerLinkActive="active-menu">
          <ion-icon name="grid-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>

        <ion-item routerLink="/admin/add-student" routerLinkActive="active-menu">
          <ion-icon name="people-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>Manage Students</ion-label>
          <ion-badge slot="end" color="primary">2,850</ion-badge>
        </ion-item>

        <ion-item routerLink="/admin/add-agent" routerLinkActive="active-menu">
          <ion-icon name="person-add-outline" slot="start" color="tertiary"></ion-icon>
          <ion-label>Faculty & Staff</ion-label>
          <ion-badge slot="end" color="success">142</ion-badge>
        </ion-item>

        <ion-item routerLink="/admin/academic" routerLinkActive="active-menu">
          <ion-icon name="school-outline" slot="start" color="warning"></ion-icon>
          <ion-label>Academic Setup</ion-label>
        </ion-item>

        <ion-list-header class="ion-margin-top">
          <ion-label>MANAGEMENT</ion-label>
        </ion-list-header>

        <ion-item routerLinkActive="active-menu">
          <ion-icon name="book-outline" slot="start" color="medium"></ion-icon>
          <ion-label>Course Catalog</ion-label>
        </ion-item>

        <ion-item routerLinkActive="active-menu">
          <ion-icon name="finger-print-outline" slot="start" color="medium"></ion-icon>
          <ion-label>Attendance Records</ion-label>
        </ion-item>

        <ion-item routerLinkActive="active-menu">
          <ion-icon name="stats-chart-outline" slot="start" color="medium"></ion-icon>
          <ion-label>Reports & Analytics</ion-label>
        </ion-item>

        <ion-item routerLink="/admin/account-setting" routerLinkActive="active-menu">
          <ion-icon name="settings-outline" slot="start" color="medium"></ion-icon>
          <ion-label>Admin Settings</ion-label>
        </ion-item>

        <ion-item routerLink="/home" lines="none" class="logout-item">
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger">Logout</ion-label>
        </ion-item>

      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- ROUTER OUTLET FOR ADMIN PAGES -->
  <ion-router-outlet id="main-admin-content"></ion-router-outlet>
</ion-split-pane>
