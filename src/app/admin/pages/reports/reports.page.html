<app-header></app-header>

<ion-content [fullscreen]="true" class="reports-page-content">
  <div class="reports-wrapper">

    <!-- PAGE HEADER -->
    <div class="page-title-row">
      <h1 class="page-title">Reports</h1>
      <span class="sub-tag font-mono-code">Updated 5m ago</span>
    </div>

    <!-- 4 METRICS STAT CARDS -->
    <div class="reports-stats-grid">
      
      <div class="stat-box">
        <span class="stat-label">Revenue (year)</span>
        <div class="stat-val">₹38.2L</div>
      </div>

      <div class="stat-box">
        <span class="stat-label">New students</span>
        <div class="stat-val">412</div>
      </div>

      <div class="stat-box">
        <span class="stat-label">Certificates issued</span>
        <div class="stat-val">268</div>
      </div>

      <div class="stat-box">
        <span class="stat-label">Refunds</span>
        <div class="stat-val">₹12,400</div>
      </div>

    </div>

    <!-- MAIN GRID CONTENT (REVENUE BY MONTH & DOWNLOAD REPORTS) -->
    <div class="reports-main-grid">

      <!-- REVENUE BY MONTH CHART CARD -->
      <div class="chart-card">
        <div class="card-header-row">
          <h2 class="card-title">Revenue by month</h2>
          <span class="legend-badge">
            <span class="dot"></span> FY 2026-27
          </span>
        </div>

        <div class="chart-area">
          <svg class="revenue-svg-chart" viewBox="0 0 600 220" preserveAspectRatio="none">
            <defs>
              <linearGradient id="chartBlueGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0"/>
              </linearGradient>
            </defs>

            <!-- Background Horizontal Grid lines -->
            <line x1="0" y1="40" x2="600" y2="40" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
            <line x1="0" y1="90" x2="600" y2="90" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
            <line x1="0" y1="140" x2="600" y2="140" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />

            <!-- Area Fill -->
            <path 
              d="M 20 160 C 80 140, 120 150, 180 120 C 240 90, 280 130, 340 100 C 400 70, 460 110, 520 80 L 580 95 L 580 180 L 20 180 Z" 
              fill="url(#chartBlueGrad)" 
            />

            <!-- Main Line -->
            <path 
              d="M 20 160 C 80 140, 120 150, 180 120 C 240 90, 280 130, 340 100 C 400 70, 460 110, 520 80 L 580 95" 
              fill="none" 
              stroke="#2563eb" 
              stroke-width="3.5" 
              stroke-linecap="round" 
            />

            <!-- Data Dots -->
            <circle cx="20" cy="160" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
            <circle cx="132" cy="144" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
            <circle cx="244" cy="102" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
            <circle cx="356" cy="98" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
            <circle cx="468" cy="92" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
            <circle cx="580" cy="95" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
          </svg>

          <!-- Month Labels Footer -->
          <div class="month-labels-row">
            <span *ngFor="let month of months" class="month-label">{{ month }}</span>
          </div>
        </div>
      </div>

      <!-- DOWNLOAD REPORTS CARD -->
      <div class="download-card">
        <h2 class="card-title">Download reports</h2>

        <div class="download-items-list">
          <div class="download-item-row" *ngFor="let item of reportItems">
            <div class="item-info">
              <span class="item-name">{{ item.title }}</span>
            </div>

            <button 
              class="btn-attractive-download" 
              [class.loading]="downloadingState[item.key]"
              (click)="downloadReport(item.key, item.title)"
            >
              <svg *ngIf="!downloadingState[item.key]" class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>{{ downloadingState[item.key] ? 'Preparing...' : 'Download' }}</span>
            </button>
          </div>
        </div>
      </div>

    </div>

  </div>
</ion-content>
