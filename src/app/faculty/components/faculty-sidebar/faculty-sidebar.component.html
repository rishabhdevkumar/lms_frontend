<div class="faculty-layout-wrapper">
  
  <!-- 1. FULL-WIDTH TOP HEADER (Spans 100% across the top) -->
  <app-faculty-header></app-faculty-header>

  <!-- 2. MAIN BODY (Below the top header) -->
  <div class="faculty-layout-body">
    
    <!-- MOBILE BACKDROP -->
    <div class="mobile-backdrop" *ngIf="isMobileOpen" (click)="closeMobile()"></div>

    <!-- COLLAPSIBLE SIDEBAR (Instagram-style shrink / expand) -->
    <aside class="faculty-sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">
      <div class="sidebar-inner">
        <nav class="sidebar-nav-list">
          
          <!-- DASHBOARD -->
          <a routerLink="/faculty/dashboard" routerLinkActive="active-menu" class="nav-item" (click)="onItemClick()" title="Dashboard">
            <div class="icon-wrap">
              <ion-icon name="grid-outline"></ion-icon>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">Dashboard</span>
          </a>

          <!-- MY CLASSES -->
          <a routerLink="/faculty/classes" routerLinkActive="active-menu" class="nav-item" (click)="onItemClick()" title="My Classes (3 Today)">
            <div class="icon-wrap">
              <ion-icon name="easel-outline"></ion-icon>
              <span class="dot-badge amber" *ngIf="isCollapsed"></span>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">My Classes</span>
            <span class="badge-count amber" *ngIf="!isCollapsed">3 Today</span>
          </a>

          <!-- ASSIGNMENTS -->
          <a routerLink="/faculty/assignments" routerLinkActive="active-menu" class="nav-item" (click)="onItemClick()" title="Assignments (18)">
            <div class="icon-wrap">
              <ion-icon name="document-text-outline"></ion-icon>
              <span class="dot-badge danger" *ngIf="isCollapsed"></span>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">Assignments</span>
            <span class="badge-count danger" *ngIf="!isCollapsed">18</span>
          </a>

          <!-- ATTENDANCE -->
          <a routerLink="/faculty/attendance" routerLinkActive="active-menu" class="nav-item" (click)="onItemClick()" title="Attendance">
            <div class="icon-wrap">
              <ion-icon name="checkmark-done-circle-outline"></ion-icon>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">Attendance</span>
          </a>

          <!-- COURSE MATERIAL -->
          <a routerLink="/faculty/course-material" routerLinkActive="active-menu" class="nav-item" (click)="onItemClick()" title="Course Material">
            <div class="icon-wrap">
              <ion-icon name="cloud-upload-outline"></ion-icon>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">Course Material</span>
          </a>

          <!-- STUDENT DOUBTS -->
          <a routerLink="/faculty/doubts" routerLinkActive="active-menu" class="nav-item" (click)="onItemClick()" title="Student Doubts (5 New)">
            <div class="icon-wrap">
              <ion-icon name="chatbubbles-outline"></ion-icon>
              <span class="dot-badge green" *ngIf="isCollapsed"></span>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">Student Doubts</span>
            <span class="badge-count green" *ngIf="!isCollapsed">5 New</span>
          </a>

        </nav>

        <!-- BOTTOM LOGOUT -->
        <div class="sidebar-footer">
          <button class="nav-item logout-btn" (click)="logout()" title="Logout">
            <div class="icon-wrap">
              <ion-icon name="log-out-outline"></ion-icon>
            </div>
            <span class="nav-label" *ngIf="!isCollapsed">Logout</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 3. MAIN ROUTED PAGE CONTENT -->
    <main class="faculty-main-content">
      <ion-router-outlet></ion-router-outlet>
    </main>

    <!-- 4. BOTTOM NAVIGATION BAR (ONLY TAB & MOBILE VIEW < 1024px) -->
    <nav class="faculty-bottom-nav">
      <!-- 1. DASHBOARD -->
      <a routerLink="/faculty/dashboard" routerLinkActive="active-tab" class="bottom-tab-item" (click)="onBottomNavClick()" title="Dashboard">
        <div class="tab-icon-wrap">
          <ion-icon name="grid-outline"></ion-icon>
        </div>
        <span class="tab-label">Dashboard</span>
      </a>

      <!-- 2. MY CLASSES -->
      <a routerLink="/faculty/classes" routerLinkActive="active-tab" class="bottom-tab-item" (click)="onBottomNavClick()" title="Classes">
        <div class="tab-icon-wrap">
          <ion-icon name="easel-outline"></ion-icon>
          <span class="tab-dot amber"></span>
        </div>
        <span class="tab-label">Classes</span>
      </a>

      <!-- 3. CENTER FAB BUTTON (ALL MODULES) -->
      <button class="bottom-fab-btn" (click)="toggleMoreSheet()" [class.fab-active]="isMoreSheetOpen" title="All Modules">
        <div class="fab-circle">
          <ion-icon [name]="isMoreSheetOpen ? 'close-outline' : 'add-outline'"></ion-icon>
        </div>
        <span class="tab-label">All</span>
      </button>

      <!-- 4. ASSIGNMENTS -->
      <a routerLink="/faculty/assignments" routerLinkActive="active-tab" class="bottom-tab-item" (click)="onBottomNavClick()" title="Assignments">
        <div class="tab-icon-wrap">
          <ion-icon name="document-text-outline"></ion-icon>
          <span class="tab-dot danger"></span>
        </div>
        <span class="tab-label">Tasks</span>
      </a>

      <!-- 5. ATTENDANCE -->
      <a routerLink="/faculty/attendance" routerLinkActive="active-tab" class="bottom-tab-item" (click)="onBottomNavClick()" title="Attendance">
        <div class="tab-icon-wrap">
          <ion-icon name="checkmark-done-circle-outline"></ion-icon>
        </div>
        <span class="tab-label">Attendance</span>
      </a>
    </nav>

    <!-- 5. ALL MODULES BOTTOM SHEET (OPENS WHEN FAB CLICKED IN TAB/MOBILE) -->
    <div class="sheet-backdrop" *ngIf="isMoreSheetOpen" (click)="closeMoreSheet()"></div>

    <div class="sheet-drawer" [class.open]="isMoreSheetOpen">
      <div class="sheet-drag-handle" (click)="closeMoreSheet()"></div>
      <div class="sheet-header">
        <div class="sheet-title-group">
          <h4>Faculty Modules</h4>
          <p>Quick access to all portal features</p>
        </div>
        <button class="sheet-close-btn" (click)="closeMoreSheet()">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <div class="sheet-grid">
        <!-- 1. DASHBOARD -->
        <a routerLink="/faculty/dashboard" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box blue">
            <ion-icon name="grid-outline"></ion-icon>
          </div>
          <span class="tile-title">Dashboard</span>
        </a>

        <!-- 2. MY CLASSES -->
        <a routerLink="/faculty/classes" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box amber">
            <ion-icon name="easel-outline"></ion-icon>
            <span class="tile-badge amber">3 Today</span>
          </div>
          <span class="tile-title">My Classes</span>
        </a>

        <!-- 3. ASSIGNMENTS -->
        <a routerLink="/faculty/assignments" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box danger">
            <ion-icon name="document-text-outline"></ion-icon>
            <span class="tile-badge danger">18</span>
          </div>
          <span class="tile-title">Assignments</span>
        </a>

        <!-- 4. ATTENDANCE -->
        <a routerLink="/faculty/attendance" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box teal">
            <ion-icon name="checkmark-done-circle-outline"></ion-icon>
          </div>
          <span class="tile-title">Attendance</span>
        </a>

        <!-- 5. COURSE MATERIAL -->
        <a routerLink="/faculty/course-material" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box emerald">
            <ion-icon name="cloud-upload-outline"></ion-icon>
          </div>
          <span class="tile-title">Course Material</span>
        </a>

        <!-- 6. STUDENT DOUBTS -->
        <a routerLink="/faculty/doubts" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box green">
            <ion-icon name="chatbubbles-outline"></ion-icon>
            <span class="tile-badge green">5 New</span>
          </div>
          <span class="tile-title">Student Doubts</span>
        </a>

        <!-- 7. PROFILE & SETTINGS -->
        <a routerLink="/faculty/profile" routerLinkActive="active-tile" class="sheet-tile" (click)="onBottomNavClick()">
          <div class="tile-icon-box purple">
            <ion-icon name="person-outline"></ion-icon>
          </div>
          <span class="tile-title">Profile</span>
        </a>

        <!-- 8. LOGOUT -->
        <button class="sheet-tile logout-tile" (click)="logout()">
          <div class="tile-icon-box red">
            <ion-icon name="log-out-outline"></ion-icon>
          </div>
          <span class="tile-title">Logout</span>
        </button>
      </div>
    </div>

  </div>
</div>
